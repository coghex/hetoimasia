# Publish `review-approved`, and invalidate an approval the pushed code moved
# out from under.
#
# Neither verdict is read from the event payload. A `synchronize` run exists
# because the head moved, and the same push starts the stale-approval decision
# that may be about to remove `reviewed:approve`: answering from the payload
# would publish the label state from before that decision. Every job here reads
# the pull request's current state, and refuses to act for a head that has
# already been superseded.
#
# The decision and the mutation are separate jobs on purpose. `decide-dismissal`
# checks the candidate out so the decision is the one `review_gate.py` is tested
# against; `dismiss-stale-approval` holds the only write permission in either
# workflow and checks nothing out, so that token never reaches
# contributor-authored code.
#
# A push keeps its approval only from a *proven* starting point: a head a
# canonical review named, or one reached from it through carries this workflow
# itself recorded. `review_provenance.py` proves that from the pull request's
# comment feed, because an attached label proves nothing about the head it was
# left on — a delayed dismissal refuses to touch a superseded head, and the
# next push would otherwise inherit whatever it left standing. From a proven
# starting point, a content-changing push keeps its approval in exactly one
# case: the push is Git's own clean merge of that head with a commit the base
# already contains, so the submitted tree is one the earlier review already
# covers. `review_replay.py` proves that in the checkout; nothing here decides
# either from the payload, and everything they cannot prove invalidates the
# approval.
name: review-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# There is deliberately no concurrency group: queueing these runs against each
# other would let GitHub cancel a pending `dismiss-stale-approval`, and a
# cancelled invalidation decision is indistinguishable from one that never
# reached a verdict. Each event gets its own run, and the current-head checks
# below are what stop a superseded one from acting.

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  decide-dismissal:
    # Only a push can invalidate an approval. Label events are answered by
    # `review-approved` alone, so the copies they start are skipped rather than
    # allowed to re-decide an untouched head.
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # The provenance proof reads the jobs of the runs that wrote each carry
      # record, to verify the recording job actually concluded successfully.
      actions: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      expected: ${{ steps.decide.outputs.expected }}
      reason: ${{ steps.decide.outputs.reason }}
      replay: ${{ steps.replay.outputs.replay_decision }}
      replay_reason: ${{ steps.replay.outputs.replay_reason }}
      approved_head: ${{ steps.replay.outputs.approved_head }}
      incorporated_base: ${{ steps.replay.outputs.incorporated_base }}
      replay_tree: ${{ steps.replay.outputs.replay_tree }}
      resulting_head: ${{ steps.replay.outputs.resulting_head }}
      provenance: ${{ steps.provenance.outputs.provenance }}
      provenance_reason: ${{ steps.provenance.outputs.provenance_reason }}
      origin: ${{ steps.provenance.outputs.origin }}
      chain: ${{ steps.provenance.outputs.chain }}
      head_approved: ${{ steps.provenance.outputs.head_approved }}
    steps:
      - name: Check out the head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.after }}
          # The replay reads the approved head, the commit the update merged in,
          # and the base's own history. A shallow clone has none of them, and a
          # replay that cannot reach its inputs strips an approval that was
          # valid.
          fetch-depth: 0

      - name: Replay the approved head onto the incorporated base
        id: replay
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # `origin/<base>` rather than the local branch: this checkout is at the
          # pushed head and has no local base branch. The script answers `strip`
          # if that ref is missing, so a fetch that came up short invalidates the
          # approval instead of silently inheriting it.
          python3 tools/validation/review_replay.py \
            --before "$BEFORE" \
            --after "$AFTER" \
            --base "origin/$BASE_REF" | tee -a "$GITHUB_OUTPUT"

      - name: Prove the starting point's approval
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          # The account the canonical coordinator and drainer publish their
          # review markers under. A marker by anyone else names no approval.
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # The whole feed, paged, into a file the script reads: the proof is
          # then exercised in tests against fixture feeds exactly as it runs
          # here. A fetch that fails leaves no file, and the script answers
          # `unproven` for that rather than aborting before the removal it
          # justifies — a feed that could not be read proves nothing.
          feed="$RUNNER_TEMP/comments.json"
          if ! gh api --paginate --slurp "repos/$REPOSITORY/issues/$NUMBER/comments?per_page=100" > "$feed"; then
            rm -f "$feed"
          fi
          # A carry record is posted while the job that writes it is still
          # running, so each one is only as good as that job's conclusion.
          # Fetch the jobs of every run attempt the records name; a listing
          # that cannot be fetched is left missing, and the record it would
          # have vouched for proves nothing.
          runs="$RUNNER_TEMP/runs"
          mkdir -p "$runs"
          while read -r run attempt; do
            [ -n "$run" ] || continue
            if ! gh api "repos/$REPOSITORY/actions/runs/$run/attempts/$attempt/jobs?per_page=100" > "$runs/$run-$attempt.json"; then
              rm -f "$runs/$run-$attempt.json"
            fi
          done < <(python3 tools/validation/review_provenance.py --list-runs --comments "$feed")
          python3 tools/validation/review_provenance.py \
            --before "$BEFORE" \
            --after "$AFTER" \
            --comments "$feed" \
            --runs "$runs" \
            --owner "$OWNER" | tee -a "$GITHUB_OUTPUT"

      - name: Decide the approval's fate
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.after }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPLAY: ${{ steps.replay.outputs.replay_decision }}
          REPLAY_REASON: ${{ steps.replay.outputs.replay_reason }}
          PROVENANCE: ${{ steps.provenance.outputs.provenance }}
          PROVENANCE_REASON: ${{ steps.provenance.outputs.provenance_reason }}
          HEAD_APPROVED: ${{ steps.provenance.outputs.head_approved }}
          LABEL: reviewed:approve
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq '.head.sha')"

          before_tree=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            before_tree="$(gh api "repos/$REPOSITORY/commits/$BEFORE" --jq '.commit.tree.sha' 2>/dev/null || true)"
          fi
          after_tree="$(gh api "repos/$REPOSITORY/commits/$AFTER" --jq '.commit.tree.sha')"

          # Read the labels into a variable rather than piping straight into an
          # `if` condition: Bash exempts a condition's failure from `set -e`, so
          # a transient API error would arrive here indistinguishable from an
          # absent label — and be read as "nothing to dismiss".
          if labels="$(gh pr view "$NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"; then
            attached=false
            if printf '%s\n' "$labels" | grep -qxF "$LABEL"; then
              attached=true
            fi
          else
            attached=unknown
          fi

          python3 tools/validation/review_gate.py dismissal \
            --event-head "$EVENT_HEAD" \
            --current-head "$current_head" \
            --before-tree "$before_tree" \
            --after-tree "$after_tree" \
            --replay-decision "$REPLAY" \
            --replay-reason "$REPLAY_REASON" \
            --provenance "$PROVENANCE" \
            --provenance-reason "$PROVENANCE_REASON" \
            --head-approved "$HEAD_APPROVED" \
            --label-attached "$attached" \
            --label "$LABEL" | tee -a "$GITHUB_OUTPUT"

  dismiss-stale-approval:
    needs: [decide-dismissal]
    # `always()`, because a push must always leave this check with a verdict.
    # Without it a failed decision would *skip* this job, and the drainer reads
    # its success together with the label: a skip is neither the success that
    # carries an approval nor the failure that is a drainer error, so an
    # unreached decision would arrive looking like a category that does not
    # exist. A label event still skips it, which is the expected result there.
    if: always() && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The only write in this repository's workflows, held by the only job that
      # checks nothing out and runs no repository script.
      pull-requests: write
    steps:
      - name: Apply the decision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.after }}
          BEFORE: ${{ github.event.before }}
          DECISION: ${{ needs['decide-dismissal'].result }}
          ACTION: ${{ needs['decide-dismissal'].outputs.action }}
          EXPECTED: ${{ needs['decide-dismissal'].outputs.expected }}
          REASON: ${{ needs['decide-dismissal'].outputs.reason }}
          REPLAY: ${{ needs['decide-dismissal'].outputs.replay }}
          REPLAY_REASON: ${{ needs['decide-dismissal'].outputs.replay_reason }}
          APPROVED_HEAD: ${{ needs['decide-dismissal'].outputs.approved_head }}
          INCORPORATED_BASE: ${{ needs['decide-dismissal'].outputs.incorporated_base }}
          REPLAY_TREE: ${{ needs['decide-dismissal'].outputs.replay_tree }}
          RESULTING_HEAD: ${{ needs['decide-dismissal'].outputs.resulting_head }}
          PROVENANCE: ${{ needs['decide-dismissal'].outputs.provenance }}
          PROVENANCE_REASON: ${{ needs['decide-dismissal'].outputs.provenance_reason }}
          ORIGIN: ${{ needs['decide-dismissal'].outputs.origin }}
          CHAIN: ${{ needs['decide-dismissal'].outputs.chain }}
          HEAD_APPROVED: ${{ needs['decide-dismissal'].outputs.head_approved }}
          OWNER: ${{ github.repository_owner }}
          LABEL: reviewed:approve
        run: |
          set -euo pipefail

          # This job holds the only write token in this repository's workflows,
          # so it checks nothing out and runs no repository code: a script from
          # the pull request's own head would be executing beside that token,
          # and neither a sparse checkout nor unpersisted credentials would make
          # it trusted. Everything below is this workflow's own shell and `gh`.
          # `workflow-tests` executes this exact step body against a stubbed
          # `gh`, so the paths that cannot be reached live are still covered.

          # Reached only because this job runs on `always()`. A decision that
          # did not conclude is not a decision to keep the approval, and the
          # outputs below would be empty strings rather than a verdict.
          if [ "$DECISION" != "success" ]; then
            echo "::error::the stale-approval decision for this push was $DECISION, so no verdict on $LABEL can be confirmed"
            exit 1
          fi

          # Read the head again here, immediately before the mutation rather
          # than only when the decision was made. The decision job's own API
          # calls take time, and a push landing in that window would leave this
          # run stripping an approval that belongs to a head it never examined.
          current_head="$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq '.head.sha')"
          if [ "$current_head" != "$EVENT_HEAD" ]; then
            echo "::error::this run was started for head $EVENT_HEAD, but the head is now $current_head; refusing to change approval for a superseded head"
            exit 1
          fi

          # A canonical review may have approved this exact head after the
          # decision was made — a fresh approval for the newest push arrives
          # whenever a reviewer is faster than a queued run — and the head
          # check above cannot see it, since the head did not move. Read the
          # owner's review markers again immediately before removing, and let
          # the newest marker naming this head win. A read that fails is not
          # an empty one: removing on it could strip an approval somebody just
          # granted, so it is refused like every other unconfirmed read here.
          if [ "$ACTION" = "remove" ]; then
            owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            if ! markers="$(gh api --paginate "repos/$REPOSITORY/issues/$NUMBER/comments?per_page=100" \
                --jq ".[] | select(((.user.login // \"\") | ascii_downcase) == \"$owner\") | .body")"; then
              echo "::error::the review markers could not be read back, so this decision is unconfirmed"
              exit 1
            fi
            newest="$(printf '%s\n' "$markers" \
              | grep -Eo "<!-- pr-review:v(2 reviewers=[^ ]+ models=[^ ]+|1 reviewer=[^ ]+) head=$EVENT_HEAD verdict=(APPROVE|CHANGES_REQUESTED) -->" \
              | tail -n 1 || true)"
            case "$newest" in
              *'verdict=APPROVE -->')
                echo "a canonical review approved head $EVENT_HEAD after the decision was made; keeping $LABEL"
                ACTION=none
                EXPECTED=kept
                REASON="a canonical review approved head ${EVENT_HEAD:0:12} itself, after this push's decision was made"
                HEAD_APPROVED=true
                ORIGIN="$EVENT_HEAD"
                CHAIN=""
                ;;
            esac
          fi

          if [ "$ACTION" = "remove" ]; then
            gh pr edit "$NUMBER" --repo "$REPOSITORY" --remove-label "$LABEL"
          fi

          # Confirm from the repository rather than from the command's exit
          # status: the drainer reads this job's success together with the
          # label, so a removal that did not take must not look like one that
          # did. The read is captured rather than piped into a condition, where
          # Bash would exempt its failure from `set -e` and an API error would
          # arrive indistinguishable from an absent label.
          if ! labels="$(gh pr view "$NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"; then
            echo "::error::the labels could not be read back, so this decision is unconfirmed"
            exit 1
          fi
          if [ "$EXPECTED" = "removed" ] && printf '%s\n' "$labels" | grep -qxF "$LABEL"; then
            echo "::error::$LABEL is still attached after the removal"
            exit 1
          fi

          echo "$LABEL $EXPECTED: $REASON"

          # A carried approval is recorded at the head it was carried to, and
          # only now: after the decision concluded, with the head still
          # current and the label confirmed attached. The record is what the
          # next push's decision reads to prove *this* head, so it is written
          # by this job alone — the only identity in this repository's
          # workflows that can — and a record that could not be written is a
          # carry the next push cannot see, which is reported rather than
          # left for that push to discover. It names this run and attempt,
          # because it is posted before this job has concluded: the proof
          # that reads it verifies that this job went on to succeed, so a
          # failure or cancellation after this point leaves a record that
          # proves nothing. A head a canonical review named itself needs no
          # record: the marker is its proof.
          carried=false
          if [ "$EXPECTED" = "kept" ] && [ "$HEAD_APPROVED" != "true" ]; then
            if [ -z "$ORIGIN" ]; then
              echo "::error::the decision kept $LABEL without a proven origin, so no carry can be recorded"
              exit 1
            fi
            if printf '%s\n' "$labels" | grep -qxF "$LABEL"; then
              record="$(printf "Carried \`%s\` from \`%s\` to \`%s\`. The review it carries was granted at \`%s\`; no reviewer examined \`%s\`. This record proves the carry only if run %s attempt %s concluded successfully.\n\n<!-- approval-provenance:v1 origin=%s before=%s after=%s run=%s attempt=%s -->" \
                "$LABEL" "${BEFORE:0:12}" "${EVENT_HEAD:0:12}" "${ORIGIN:0:12}" "${EVENT_HEAD:0:12}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
                "$ORIGIN" "$BEFORE" "$EVENT_HEAD" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
              if ! gh api -X POST "repos/$REPOSITORY/issues/$NUMBER/comments" -f body="$record" > /dev/null; then
                echo "::error::the carried approval could not be recorded at $EVENT_HEAD, so this decision is unconfirmed"
                exit 1
              fi
              carried=true
            fi
          fi

          # Provenance, not a review. Every field below names a revision this
          # decision was actually made from, and the closing line says plainly
          # whose review is being carried and that nobody read the integration
          # tree — an approval standing on a merged head must never be mistaken
          # in the log for one somebody granted to that head.
          provenance() {
            if [ -n "$2" ]; then
              printf -- '- %s: `%s`\n' "$1" "$2"
            else
              printf -- '- %s: not established\n' "$1"
            fi
          }
          {
            echo "## Stale approval"
            echo
            echo "- Push: \`${BEFORE:0:12}\`..\`${EVENT_HEAD:0:12}\`"
            echo "- Replay: $REPLAY — $REPLAY_REASON"
            echo "- \`$LABEL\`: $EXPECTED — $REASON"
            echo "- Starting point: $PROVENANCE — $PROVENANCE_REASON"
            provenance "Proven origin" "$ORIGIN"
            provenance "Approved head" "$APPROVED_HEAD"
            provenance "Incorporated base commit" "$INCORPORATED_BASE"
            provenance "Replay tree" "$REPLAY_TREE"
            provenance "Resulting head" "$RESULTING_HEAD"
            if [ "$HEAD_APPROVED" = "true" ]; then
              echo "- A canonical review named this head itself, so nothing is inherited."
            elif [ "$carried" = "true" ]; then
              route=""
              IFS=',' read -ra hops <<< "$CHAIN"
              for hop in "${hops[@]}" "$EVENT_HEAD"; do
                route="${route:+$route → }\`${hop:0:12}\`"
              done
              echo "- Reached from the proven origin through: $route"
              echo "- The review being carried was granted at the proven origin, the revision a reviewer read; every later head on that route was reached by a recorded carry, and no reviewer examined the resulting integration tree."
            elif [ "$EXPECTED" = "kept" ]; then
              echo "- The decision kept \`$LABEL\`, but it was no longer attached when this decision was applied, so no carry was recorded."
            elif [ "$REPLAY" = "keep" ] && [ "$EXPECTED" = "absent" ]; then
              echo "- The push was replay-eligible, but \`$LABEL\` was not attached, so no review is being carried forward."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  review-approved:
    # Runs after the invalidation decision on every event, so a synchronize can
    # never publish approval before that decision has been made.
    needs: [dismiss-stale-approval]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Publish the review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          DISMISSAL: ${{ needs['dismiss-stale-approval'].result }}
          LABEL: reviewed:approve
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq '.head.sha')"
          if labels="$(gh pr view "$NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels[].name')"; then
            attached=false
            if printf '%s\n' "$labels" | grep -qxF "$LABEL"; then
              attached=true
            fi
          else
            attached=unknown
          fi
          {
            echo "## Review gate"
            echo
            echo "- Head: \`${current_head:0:12}\`"
            echo "- Stale-approval decision: $DISMISSAL"
            echo "- \`$LABEL\` attached: $attached"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/validation/review_gate.py verdict \
            --event-action "$EVENT_ACTION" \
            --event-head "$EVENT_HEAD" \
            --current-head "$current_head" \
            --dismissal-result "$DISMISSAL" \
            --label-attached "$attached" \
            --label "$LABEL"
