# Resolve the Linux CI image for one recipe fingerprint, publish it only on a
# confirmed miss, and return the descriptor the author commits.
#
# This is the only workflow that holds `packages: write`, and only its publish
# job does. It starts by manual dispatch or from a same-repository pull request
# that changes an image input; an ordinary source change never starts it, and
# ordinary validation workers only pull the digest the committed descriptor
# names. See docs/validation.md.
#
# It also carries two isolated routes that have nothing to do with publishing
# an image, and both are here rather than in workflows of their own for one
# reason: GitHub only offers `workflow_dispatch` for a workflow that already
# exists on the default branch, so a brand-new workflow cannot supply pre-merge
# evidence for the pull request that introduces it. Dispatch either against the
# candidate branch with `--ref`. Neither publishes anything, neither writes a
# descriptor, neither holds a package grant, the image jobs below are skipped
# whenever either runs, and both are skipped for every other event — no push and
# no pull request starts them.
#
# `route: vulkan-proof` runs the native Vulkan compatibility proof inside the
# image the checked-out `tools/ci-image/descriptor.json` names, on an isolated
# X11 display. VK-4 provisioned the loader, driver, and layers into that image,
# so the throwaway container this route used to build is gone and the proof now
# runs against exactly the inputs ordinary Linux validation runs against. See
# docs/vulkan_compatibility_record.md.
#
# `route: wayland-probe` runs `tools/display/wayland.sh` inside the image the
# checked-out `tools/ci-image/descriptor.json` names, and shows that the helper
# established an isolated headless session and removed the runtime directory it
# created. It is WL-1's one-off provisioning proof, dispatched deliberately;
# registering a validation group that runs the native suite under the Wayland
# helper is WL-2's and WL-3's work, not this route's.
name: ci-image

on:
  workflow_dispatch:
    inputs:
      route:
        description: 'image: resolve and publish the CI image. vulkan-proof: run the VK-2 native proof and publish nothing. wayland-probe: run the WL-1 compositor proof in the described image and publish nothing.'
        type: choice
        options:
          - image
          - vulkan-proof
          - wayland-probe
        default: image
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'tools/ci-image/**'
      - 'tools/native/**'
      - 'tools/validation/ci_image.py'
      - '.github/workflows/ci-image.yml'
      # Committing the returned descriptor is not an image input.
      - '!tools/ci-image/descriptor.json'

permissions:
  contents: read

# The image must install exactly the toolchain the validation workflow pins,
# and exactly the compositor revision tools/ci-image/compositor.pin names. The
# builder refuses to publish or accept an image whose installed compositor
# disagrees with this value, which is what catches a drift between the two.
env:
  GHC_VERSION: '9.14.1'
  CABAL_VERSION: '3.18.1.0'
  WESTON_VERSION: '13.0.0-4build3'

defaults:
  run:
    shell: bash

jobs:
  vulkan-proof:
    # Only ever on an explicit request for this route, so an ordinary image
    # dispatch and every pull request skip it.
    if: github.event_name == 'workflow_dispatch' && inputs.route == 'vulkan-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # No package grant and no publication: this route proves a runtime profile
    # and returns a record.
    permissions:
      contents: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Identify the image this candidate describes
        id: image
        run: |
          set -euo pipefail
          reference="$(python3 -c 'import json; d = json.load(open("tools/ci-image/descriptor.json")); print(d["reference"] + "@" + d["digest"])')"
          recorded="$(python3 -c 'import json; print(json.load(open("tools/ci-image/descriptor.json"))["recipe_fingerprint"])')"
          # A proof run in some other tree's image proves nothing about this
          # one, so the descriptor has to describe this candidate before it is
          # used — exactly as the wayland-probe route requires.
          candidate="$(python3 tools/validation/ci_image.py fingerprint --revision HEAD)"
          if [ "$recorded" != "$candidate" ]; then
            echo "::error::the committed descriptor records recipe fingerprint $recorded, but this candidate fingerprints to $candidate"
            exit 1
          fi
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$candidate" >> "$GITHUB_OUTPUT"
          {
            echo "proving ${{ github.sha }} on ${{ github.ref }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Image | \`$reference\` |"
            echo "| Recipe fingerprint | \`$candidate\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the pulled image is the one the descriptor describes
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          # The descriptor is excluded from the recipe fingerprint, so matching
          # that fingerprint against the candidate says nothing about which
          # image the descriptor's digest actually points at. This asks the
          # image what it is — the fingerprint it embeds, the native manifest it
          # carries, and the Vulkan identities its own prefix yields — and
          # refuses to prove anything on an image that answers differently.
          {
            echo '## The image the record is attributable to'
            echo
            echo '```'
            docker run --rm \
              --volume "$PWD:/candidate:ro" --workdir /candidate \
              --entrypoint python3 "$REFERENCE" \
              tools/validation/ci_image.py verify-image \
                --descriptor tools/ci-image/descriptor.json \
                --repo-root /opt/hetoimasia/recipe
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the proof on an isolated X11 display inside that image
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/record"
          # The candidate tree supplies the harness and the display helper; the
          # image supplies the toolchain, the private native prefix, and the
          # Vulkan runtime. The mount is writable because the build directory
          # lives in it, and the revision is passed in because a checkout
          # mounted into a container is not one `git` will speak for.
          docker run --rm \
            --env HETOIMASIA_VULKAN_PROOF_RECORD=/record/vulkan-compatibility-linux.md \
            --env HETOIMASIA_PROOF_REVISION="$REVISION" \
            --volume "$RUNNER_TEMP/record:/record" \
            --volume "$PWD:/candidate" --workdir /candidate \
            "$REFERENCE" bash tools/display/x11.sh -- bash tools/vulkan-proof/run-proof.sh

      - name: Show the record
        if: always()
        run: |
          set -euo pipefail
          if [ -r "$RUNNER_TEMP/record/vulkan-compatibility-linux.md" ]; then
            cat "$RUNNER_TEMP/record/vulkan-compatibility-linux.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## No record' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'The proof produced no record; the job log is the only evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulkan-compatibility-linux
          path: ${{ runner.temp }}/record/
          if-no-files-found: warn

  resolve:
    # A fork's pull request can neither hold a package grant nor be allowed to
    # start publication. The proof route publishes nothing, so it never reaches
    # this job.
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.route != 'vulkan-proof' && inputs.route != 'wayland-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.name.outputs.image }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      status: ${{ steps.lookup.outputs.status }}
      digest: ${{ steps.lookup.outputs.digest }}
      native-manifest: ${{ steps.lookup.outputs.native-manifest }}
      vulkan: ${{ steps.lookup.outputs.vulkan }}
      vulkan-loader: ${{ steps.lookup.outputs.vulkan-loader }}
      vulkan-driver: ${{ steps.lookup.outputs.vulkan-driver }}
      vulkan-layers: ${{ steps.lookup.outputs.vulkan-layers }}
      glslang: ${{ steps.lookup.outputs.glslang }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Name the image
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-ci" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the recipe
        id: fingerprint
        run: |
          set -euo pipefail
          fingerprint="$(python3 tools/validation/ci_image.py fingerprint --revision HEAD)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "recipe fingerprint $fingerprint"

      - name: Look up the published tag
        id: lookup
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/ci-image/builder.py resolve \
            --image "$IMAGE" --fingerprint "$FINGERPRINT" \
            --ghc "$GHC_VERSION" --cabal "$CABAL_VERSION" --weston "$WESTON_VERSION" \
            --registry tools/ci-image/registry.py \
            --github-output "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.status == 'miss'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    # Publication for one fingerprint is serialized. The job looks the tag up
    # again once it holds the group, so a builder that published while this one
    # waited is returned rather than overwritten.
    concurrency:
      group: ci-image-publish-${{ needs.resolve.outputs.fingerprint }}
      cancel-in-progress: false
    outputs:
      status: ${{ steps.publish.outputs.status }}
      digest: ${{ steps.publish.outputs.digest }}
      native-manifest: ${{ steps.publish.outputs.native-manifest }}
      vulkan: ${{ steps.publish.outputs.vulkan }}
      vulkan-loader: ${{ steps.publish.outputs.vulkan-loader }}
      vulkan-driver: ${{ steps.publish.outputs.vulkan-driver }}
      vulkan-layers: ${{ steps.publish.outputs.vulkan-layers }}
      glslang: ${{ steps.publish.outputs.glslang }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Confirm the fingerprint
        env:
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
        run: |
          set -euo pipefail
          actual="$(python3 tools/validation/ci_image.py fingerprint --revision HEAD)"
          if [ "$actual" != "$FINGERPRINT" ]; then
            echo "::error::this job checked out recipe fingerprint $actual rather than the resolved $FINGERPRINT"
            exit 1
          fi

      - name: Stage the build context
        run: python3 tools/ci-image/builder.py stage --revision HEAD --output "$RUNNER_TEMP/context"

      - name: Sign in to the registry
        env:
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Publish once
        id: publish
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/ci-image/builder.py publish \
            --image "$IMAGE" --fingerprint "$FINGERPRINT" \
            --ghc "$GHC_VERSION" --cabal "$CABAL_VERSION" --weston "$WESTON_VERSION" \
            --registry tools/ci-image/registry.py \
            --context "$RUNNER_TEMP/context" \
            --github-output "$GITHUB_OUTPUT"

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  descriptor:
    needs: [resolve, publish]
    if: always() && needs.resolve.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reference: ${{ steps.write.outputs.reference }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Write the descriptor
        id: write
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
          RESOLVED_DIGEST: ${{ needs.resolve.outputs.digest }}
          RESOLVED_MANIFEST: ${{ needs.resolve.outputs.native-manifest }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
          PUBLISHED_MANIFEST: ${{ needs.publish.outputs.native-manifest }}
          RESOLVED_VULKAN: ${{ needs.resolve.outputs.vulkan }}
          RESOLVED_VULKAN_LOADER: ${{ needs.resolve.outputs.vulkan-loader }}
          RESOLVED_VULKAN_DRIVER: ${{ needs.resolve.outputs.vulkan-driver }}
          RESOLVED_VULKAN_LAYERS: ${{ needs.resolve.outputs.vulkan-layers }}
          RESOLVED_GLSLANG: ${{ needs.resolve.outputs.glslang }}
          PUBLISHED_VULKAN: ${{ needs.publish.outputs.vulkan }}
          PUBLISHED_VULKAN_LOADER: ${{ needs.publish.outputs.vulkan-loader }}
          PUBLISHED_VULKAN_DRIVER: ${{ needs.publish.outputs.vulkan-driver }}
          PUBLISHED_VULKAN_LAYERS: ${{ needs.publish.outputs.vulkan-layers }}
          PUBLISHED_GLSLANG: ${{ needs.publish.outputs.glslang }}
        run: |
          set -euo pipefail
          # A hit answers from `resolve`, a miss from `publish`; every value in
          # the descriptor comes from whichever of the two actually looked at
          # the image, so a partly-filled descriptor cannot be written.
          digest="${PUBLISHED_DIGEST:-$RESOLVED_DIGEST}"
          manifest="${PUBLISHED_MANIFEST:-$RESOLVED_MANIFEST}"
          vulkan="${PUBLISHED_VULKAN:-$RESOLVED_VULKAN}"
          vulkan_loader="${PUBLISHED_VULKAN_LOADER:-$RESOLVED_VULKAN_LOADER}"
          vulkan_driver="${PUBLISHED_VULKAN_DRIVER:-$RESOLVED_VULKAN_DRIVER}"
          vulkan_layers="${PUBLISHED_VULKAN_LAYERS:-$RESOLVED_VULKAN_LAYERS}"
          glslang="${PUBLISHED_GLSLANG:-$RESOLVED_GLSLANG}"
          python3 tools/ci-image/builder.py descriptor \
            --image "$IMAGE" --digest "$digest" --fingerprint "$FINGERPRINT" \
            --native-manifest "$manifest" --ghc "$GHC_VERSION" --cabal "$CABAL_VERSION" \
            --weston "$WESTON_VERSION" \
            --vulkan "$vulkan" --vulkan-loader "$vulkan_loader" \
            --vulkan-driver "$vulkan_driver" --vulkan-layers "$vulkan_layers" \
            --glslang "$glslang" \
            --output descriptor.json
          echo "reference=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## CI image descriptor"
            echo
            echo "Commit this as \`tools/ci-image/descriptor.json\`:"
            echo
            echo '```json'
            cat descriptor.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the descriptor
        uses: actions/upload-artifact@v7
        with:
          name: ci-image-descriptor
          path: descriptor.json
          if-no-files-found: error

  anonymous-pull:
    needs: descriptor
    # Explicit, because a skipped `publish` — every hit — would otherwise skip
    # this too, and a hit's image has to be pullable just the same.
    if: always() && needs.descriptor.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No grant at all: the package must be public for this pull to succeed,
    # exactly as ordinary validation workers pull it.
    permissions: {}
    steps:
      - name: Pull the image by digest without credentials
        env:
          REFERENCE: ${{ needs.descriptor.outputs.reference }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          started=$(date +%s)
          docker pull "$REFERENCE"
          ended=$(date +%s)
          {
            echo "## Anonymous pull"
            echo
            echo "Pulled \`$REFERENCE\` with no registry credentials in $((ended - started))s."
          } >> "$GITHUB_STEP_SUMMARY"

  wayland-probe:
    # Only ever on an explicit request for this route, so an ordinary image
    # dispatch and every pull request skip it. `resolve` excludes this route by
    # name, and everything that publishes reaches the registry through
    # `resolve`, so no part of the publication chain runs for it.
    if: github.event_name == 'workflow_dispatch' && inputs.route == 'wayland-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No package grant and no publication: this route proves what the described
    # image can do and returns a record.
    permissions:
      contents: read
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Identify the image this candidate describes
        id: image
        run: |
          set -euo pipefail
          reference="$(python3 -c 'import json; d = json.load(open("tools/ci-image/descriptor.json")); print(d["reference"] + "@" + d["digest"])')"
          recorded="$(python3 -c 'import json; print(json.load(open("tools/ci-image/descriptor.json"))["recipe_fingerprint"])')"
          # A proof of some other tree's image proves nothing about this one,
          # so the descriptor has to describe this candidate before it is used.
          candidate="$(python3 tools/validation/ci_image.py fingerprint --revision HEAD)"
          if [ "$recorded" != "$candidate" ]; then
            echo "::error::the committed descriptor records recipe fingerprint $recorded, but this candidate fingerprints to $candidate"
            exit 1
          fi
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$candidate" >> "$GITHUB_OUTPUT"

      - name: Prove the isolated headless compositor inside it
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
          FINGERPRINT: ${{ steps.image.outputs.fingerprint }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # One container, so the helper's cleanup is established while the
          # container it ran in is still there: a destroyed container would
          # have taken the runtime directory with it either way. The candidate
          # tree supplies the helper; the image supplies Weston. `true` is the
          # whole command — what is under proof is that the helper establishes
          # a private compositor here and tears it down, not what a command
          # does inside it.
          docker run --rm \
            --env EXPECTED_FINGERPRINT="$FINGERPRINT" \
            --volume "$PWD:/candidate:ro" --workdir /candidate \
            "$REFERENCE" bash -c '
              set -euo pipefail
              embedded="$(jq -r .recipe_fingerprint /opt/hetoimasia/image.json)"
              compositor="$(jq -r .weston /opt/hetoimasia/image.json)"
              if [ "$embedded" != "$EXPECTED_FINGERPRINT" ]; then
                echo "this image embeds recipe fingerprint $embedded, not the candidate'\''s $EXPECTED_FINGERPRINT" >&2
                exit 1
              fi
              echo "image recipe fingerprint: $embedded"
              echo "installed compositor: weston $(dpkg-query --show --showformat='\''${Version}'\'' weston)"
              echo "descriptor compositor: weston $compositor"
              echo
              echo "$ bash tools/display/wayland.sh --summary summary.md -- true"
              report="$(bash tools/display/wayland.sh --summary /tmp/summary.md -- true)"
              printf "%s\n" "$report"
              runtime="${report##*runtime directory }"
              runtime="${runtime%%,*}"
              if [ -e "$runtime" ]; then
                echo "the helper left $runtime behind" >&2
                exit 1
              fi
              echo
              echo "cleanup: $runtime no longer exists, checked inside the same container"
              echo
              cat /tmp/summary.md
            ' | tee "$RUNNER_TEMP/proof.txt"
          {
            echo '## WL-1 isolated headless compositor proof'
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Candidate | \`$REVISION\` |"
            echo "| Recipe fingerprint | \`$FINGERPRINT\` |"
            echo "| Image | \`$REFERENCE\` |"
            echo
            echo '```'
            cat "$RUNNER_TEMP/proof.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
