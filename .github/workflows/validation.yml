# Resolve this candidate's validation plan, execute the groups it selects, and
# publish one honest `build-test` verdict.
#
# The plan is cheap and runs first on Python and Git alone, so a documentation
# candidate never pays for a Haskell image to learn that it needs one job. The
# plan job then asks whether a finished run already executed any selected group
# against byte-identical inputs, and records the answer as applicability. The
# workers execute whatever is left, inside the published CI image the
# candidate's descriptor names. `build-test` then runs whatever happened
# upstream and decides the verdict from the receipts and that applicability, so
# a selected group can never pass because nothing ran it, an explained omission
# is never reported as a failure, and a reused group is always reported as an
# earlier execution rather than as a fresh pass.
name: validation

on:
  pull_request:
    # `edited` is included because the pull-request body carries the validation
    # request: changing which groups are asked for must re-plan, even though no
    # commit moved.
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [master]

concurrency:
  # One group per pull request, and deliberately no cancellation: a prose edit
  # must not destroy a code run that is still the newest useful execution.
  # Freshness is enforced by `build-test` comparing the plan against the pull
  # request's current state, not by throwing work away.
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Every job reads; none writes, and none uses a secret. The CI image is a public
# package, so no worker needs a registry credential or a package grant.
permissions:
  contents: read

# The pinned platform is declared once. The planner checks the committed image
# descriptor against these exact values and folds them, with the image digest
# and its native manifest, into the candidate's input identity; each worker
# verifies them inside the image. Evidence can never be reused across a
# toolchain the candidate was not planned for.
env:
  GHC_VERSION: '9.14.1'
  CABAL_VERSION: '3.18.1.0'
  WORKER_OS: Linux

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading another run's artifacts is what lets a prose-only candidate
      # inherit code evidence. It reads; it never writes or deletes.
      actions: read
    outputs:
      selected: ${{ steps.resolve.outputs.selected }}
      execute: ${{ steps.reuse.outputs.execute }}
      reused: ${{ steps.reuse.outputs.reused }}
      identity: ${{ steps.reuse.outputs.input_identity }}
      # Routing outputs per worker, read back from the plan's validated
      # assignment rather than restated here: whether the job still has work,
      # and every group the plan assigns it.
      engine: ${{ steps.reuse.outputs.run-haskell-engine }}
      engine-groups: ${{ steps.reuse.outputs.assigned-haskell-engine }}
      workflow: ${{ steps.reuse.outputs.run-haskell-workflow }}
      workflow-groups: ${{ steps.reuse.outputs.assigned-haskell-workflow }}
      native: ${{ steps.reuse.outputs.run-glfw-native }}
      native-groups: ${{ steps.reuse.outputs.assigned-glfw-native }}
      base: ${{ steps.range.outputs.base }}
      head: ${{ steps.range.outputs.head }}
      # Selection uses the merge-base range, but every job executes this one
      # integration candidate. Publishing it pins the revision the workers must
      # confirm they checked out, so two jobs can never report on two trees.
      candidate: ${{ github.sha }}
      # The exact image reference, `<repository>@<digest>`, every Linux worker
      # runs in, and the cache environment boundary derived from the planned
      # toolchain map.
      image: ${{ steps.image.outputs.image }}
      environment: ${{ steps.image.outputs.environment }}
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7
        with:
          # The planner compares two commits, so it needs their history rather
          # than a shallow tip.
          fetch-depth: 0

      - name: Resolve the comparison range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null || true
            arguments=(--event pull_request --base-sha "$PR_BASE_SHA" --head-sha "$PR_HEAD_SHA")
          else
            arguments=(--event push --before "${PUSH_BEFORE:-}" --after "$PUSH_AFTER")
          fi
          # The two events ask different questions, and getting a push's range
          # wrong hides exactly the work a force push removed. That resolution
          # is a tested tool rather than shell arithmetic here.
          python3 tools/validation/range.py "${arguments[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Capture the validation request
        env:
          # The body reaches the file through the environment and never through
          # shell interpolation: it is contributor-authored text, and the
          # planner is the only thing that may interpret it.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          : > request.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s' "$PR_BODY" > request.txt
          fi

      - name: Resolve the plan
        id: resolve
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          CANDIDATE: ${{ github.sha }}
          GHC_VERSION: ${{ env.GHC_VERSION }}
          CABAL_VERSION: ${{ env.CABAL_VERSION }}
          WORKER_OS: ${{ env.WORKER_OS }}
        run: |
          set -uo pipefail
          # Selection compares the contribution, but identity fingerprints the
          # integration candidate the workers actually check out, and the
          # toolchain and platform this workflow pins are part of it. The
          # planner reads the candidate's image descriptor without pulling the
          # image, and refuses one that no longer describes the candidate.
          arguments=(--base "$BASE" --head "$HEAD" --candidate "$CANDIDATE" --json)
          arguments+=(--toolchain "ghc=$GHC_VERSION" --toolchain "cabal=$CABAL_VERSION")
          arguments+=(--runner-os "$WORKER_OS")
          # Every worker, the runner classes it provides, and the groups it owns,
          # declared once. The planner refuses a routing no worker could honour —
          # a display group on a CPU-only worker, or a group owned twice or by
          # nobody — and every later step reads the assignment out of the plan.
          arguments+=(--worker "haskell-engine=cpu:build.all,test.engine,test.foundation,test.runtime,test.glfw,smoke.console")
          arguments+=(--worker "haskell-workflow=cpu:test.workflow")
          arguments+=(--worker "glfw-native=display:test.glfw-native")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # A push carries no pull-request body, so it carries no request.
            arguments+=(--request-file request.txt)
          fi
          if ! python3 tools/validation/plan.py "${arguments[@]}" > plan.json 2> plan.err; then
            cat plan.err >&2
            echo "::error::the validation planner failed; see the diagnostic above"
            {
              echo "## Validation plan"
              echo
              echo '```'
              cat plan.err
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          plan = json.load(open("plan.json", encoding="utf-8"))
          print("selected=" + " ".join(plan["selected"]))

          rows = [
              "## Validation plan",
              "",
              f"`{plan['base']['commit'][:12]}`..`{plan['head']['commit'][:12]}`"
              f" on candidate `{plan['candidate']['commit'][:12]}`,"
              f" policy version {plan['catalog_policy_version']}"
              f" (`{plan['policy_version'][:12]}`),"
              f" inputs `{plan['input_identity'][:12]}`.",
              "",
              "Toolchain: " + ", ".join(f"`{name}` `{value}`" for name, value in sorted(plan["toolchain"].items())) + ".",
              "",
              "| Group | Selected | Reason | Inputs changed |",
              "| --- | --- | --- | --- |",
          ]
          for entry in plan["groups"]:
              rows.append(
                  f"| `{entry['id']}` | {'yes' if entry['selected'] else 'no'} |"
                  f" {entry['reason']} | {'yes' if entry['inputs_changed'] else 'no'} |"
              )
          rows.append("")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(rows))
          PY

      - name: Reuse evidence an earlier run already produced
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          # This step never decides a verdict, so it must never be the reason a
          # candidate fails: an unreachable API, an expired artifact, or a
          # refused receipt all have to end with the group executing. It writes
          # an applicability document that reuses nothing rather than failing,
          # and `--offline` is the same answer for a lookup that never started.
          if ! python3 tools/validation/reuse.py \
            --plan plan.json \
            --repo "$REPOSITORY" \
            --output applicability.json \
            --budget-seconds 120 \
            --summary "$GITHUB_STEP_SUMMARY" \
            > reuse.out; then
            echo "::warning::the reuse lookup failed; every selected group will execute"
            python3 tools/validation/reuse.py \
              --plan plan.json \
              --repo "$REPOSITORY" \
              --output applicability.json \
              --offline \
              > reuse.out || exit 1
          fi
          cat reuse.out >> "$GITHUB_OUTPUT"
          cat reuse.out

      - name: Resolve the execution image
        id: image
        run: |
          set -euo pipefail
          python3 tools/validation/ci_image.py outputs --plan plan.json | tee -a "$GITHUB_OUTPUT"

      - name: Look up the default-branch dependency cache
        id: seed-lookup
        # Only asked on a default-branch push whose engine worker will not run:
        # a running engine worker builds and saves the dependencies itself, and
        # a pull request's cache is not a seed any other pull request restores.
        if: github.event_name == 'push' && steps.reuse.outputs.run-haskell-engine != 'true' && steps.image.outputs.image != ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: /opt/hetoimasia/cabal/store
          key: cabal-store-${{ steps.image.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}
          lookup-only: true

      - name: Decide whether to seed the dependency cache
        id: seed
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ steps.image.outputs.image }}
          ENGINE: ${{ steps.reuse.outputs.run-haskell-engine }}
          LOOKUP: ${{ steps.seed-lookup.outcome }}
          HIT: ${{ steps.seed-lookup.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # Reused test evidence can leave every worker skipped on a
          # default-branch push, which proves nothing about whether that branch
          # holds a dependency cache pull requests can restore. A missing seed is
          # built on its own, without executing any test group again.
          seed=false
          if [ "$EVENT_NAME" != "push" ]; then
            reason="only a default-branch push seeds the shared dependency cache"
          elif [ -z "$IMAGE" ]; then
            reason="the plan names no CI image"
          elif [ "$ENGINE" = "true" ]; then
            reason="the haskell-engine worker builds and saves the dependencies itself"
          elif [ "$LOOKUP" != "success" ]; then
            seed=true
            reason="the dependency cache lookup did not answer, so it is seeded rather than assumed"
          elif [ "$HIT" = "true" ]; then
            reason="the default-branch dependency cache for this environment already exists"
          else
            seed=true
            reason="no default-branch dependency cache exists for this environment and dependency configuration"
          fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "seed-dependencies: $seed ($reason)"
          {
            echo "## Dependency cache seed"
            echo
            echo "Seed: \`$seed\` — $reason."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        uses: actions/upload-artifact@v7
        with:
          name: validation-plan
          path: |
            plan.json
            applicability.json
          if-no-files-found: error

  haskell-engine:
    needs: plan
    # A worker whose groups the plan all explained away is skipped entirely
    # rather than started to do nothing.
    if: needs.plan.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Bound to the descriptor's exact digest: the runtime's digest-addressed
    # launch establishes which image runs. No apt, no GHC install, and no GLFW
    # build happens here.
    container:
      image: ${{ needs.plan.outputs.image }}
      # An init process as PID 1 reaps orphaned descendants, as the hosted
      # runner's own init does. Without it a process group the runner killed
      # on a timeout leaves zombies that still answer a liveness probe.
      options: --init
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Confirm the pinned candidate
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          # The container runs as root over a workspace the runner's user owns,
          # which Git refuses as dubious ownership. The exception is recorded in
          # the job's global configuration, so the runner's later Git reads of
          # this same checkout are answered too.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE" ]; then
            echo "::error::this job checked out $actual rather than the planned candidate $CANDIDATE"
            exit 1
          fi

      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: validation-plan

      - name: Verify the execution environment
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          set -euo pipefail
          # The embedded recipe fingerprint, the native manifest this image
          # actually carries, the compilers it actually runs, and the Cabal
          # store it resolves, all against the plan. The map it writes is the
          # one every receipt below declares, and it must equal the plan's.
          python3 tools/validation/ci_image.py verify-worker \
            --plan plan.json --toolchain-file "$RUNNER_TEMP/toolchain.txt" | tee "$RUNNER_TEMP/verify.out"
          declared="$(sed -n 's/^environment=//p' "$RUNNER_TEMP/verify.out")"
          if [ "$declared" != "$ENVIRONMENT" ]; then
            echo "::error::this worker's verified environment $declared is not the planned $ENVIRONMENT"
            exit 1
          fi

      - name: Link a native consumer against the image's GLFW
        run: python3 tools/native/native.py link-check

      - name: Restore the package store
        id: store
        uses: actions/cache/restore@v6
        with:
          path: /opt/hetoimasia/cabal/store
          # The environment key is the planned image, platform, and toolchain;
          # `cabal.project` carries the pinned Hackage index state and the
          # `.cabal` files the dependency bounds. The fallback stays inside the
          # same environment: no restore may cross an image or native change.
          key: cabal-store-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}
          restore-keys: |
            cabal-store-${{ needs.plan.outputs.environment }}-

      - name: Restore the build tree
        id: tree
        uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-newstyle-engine-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}-${{ hashFiles('**/*.hs') }}
          # A partial match still saves most of the compile: a cache miss costs
          # time and can never change a result.
          restore-keys: |
            dist-newstyle-engine-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}-
            dist-newstyle-engine-${{ needs.plan.outputs.environment }}-

      - name: Record the cache results
        env:
          SCOPE: ${{ github.ref }}
          STORE_HIT: ${{ steps.store.outputs.cache-hit }}
          STORE_KEY: ${{ steps.store.outputs.cache-primary-key }}
          STORE_MATCHED: ${{ steps.store.outputs.cache-matched-key }}
          TREE_HIT: ${{ steps.tree.outputs.cache-hit }}
          TREE_KEY: ${{ steps.tree.outputs.cache-primary-key }}
          TREE_MATCHED: ${{ steps.tree.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          result() { if [ "$1" = "true" ]; then echo hit; elif [ -n "$2" ]; then echo partial; else echo miss; fi; }
          {
            echo "## haskell-engine caches"
            echo
            echo "Scope \`$SCOPE\`."
            echo
            echo "| Cache | Result | Key | Restored from |"
            echo "| --- | --- | --- | --- |"
            echo "| package store | $(result "$STORE_HIT" "$STORE_MATCHED") | \`$STORE_KEY\` | \`${STORE_MATCHED:-none}\` |"
            echo "| build tree | $(result "$TREE_HIT" "$TREE_MATCHED") | \`$TREE_KEY\` | \`${TREE_MATCHED:-none}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the groups this candidate still needs
        env:
          SELECTED: ${{ needs.plan.outputs.selected }}
          EXECUTE: ${{ needs.plan.outputs.execute }}
          ASSIGNED: ${{ needs.plan.outputs.engine-groups }}
        run: |
          set -uo pipefail
          mkdir -p receipts
          toolchain=()
          while IFS= read -r entry; do
            toolchain+=(--toolchain "$entry")
          done < "$RUNNER_TEMP/toolchain.txt"
          status=0
          # Every owned group runs even after one fails, so the aggregate sees
          # a receipt for each of them rather than inferring the rest from the
          # first failure. A group the plan selected but an earlier execution
          # already covered is announced as reused rather than as unselected:
          # the two are different facts and the log must not conflate them. The
          # groups are exactly the ones the plan assigns this worker.
          for group in $ASSIGNED; do
            case " $EXECUTE " in
              *" $group "*) ;;
              *)
                case " $SELECTED " in
                  *" $group "*) echo "skipping $group: an earlier execution already covers it" ;;
                  *) echo "skipping $group: the plan did not select it" ;;
                esac
                continue
                ;;
            esac
            python3 -I tools/validation/run.py "$group" \
              --plan plan.json \
              --receipts receipts \
              --worker haskell-engine \
              --runner-class cpu \
              "${toolchain[@]}" || status=1
          done
          exit "$status"

      - name: Save the package store
        if: ${{ !cancelled() && steps.store.outcome == 'success' && steps.store.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /opt/hetoimasia/cabal/store
          key: ${{ steps.store.outputs.cache-primary-key }}

      - name: Save the build tree
        if: ${{ !cancelled() && steps.tree.outcome == 'success' && steps.tree.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: dist-newstyle
          key: ${{ steps.tree.outputs.cache-primary-key }}

      - name: Upload the receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-receipts-haskell-engine
          path: receipts/
          if-no-files-found: warn

      - name: Publish the build.all receipt as reusable evidence
        # Named by the candidate's input identity, so a later run asks for
        # evidence about *these* inputs rather than fetching every receipt the
        # group ever produced. A group that did not execute leaves no file and
        # therefore publishes nothing.
        if: always() && hashFiles('receipts/build.all.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: receipt-build.all-${{ needs.plan.outputs.identity }}
          path: receipts/build.all.json
          if-no-files-found: error
          # A re-run of this same run would otherwise collide with the attempt
          # before it; the newest attempt is the one that should stand.
          overwrite: true

      - name: Publish the test.engine receipt as reusable evidence
        # Named by the candidate's input identity, so a later run asks for
        # evidence about *these* inputs rather than fetching every receipt the
        # group ever produced. A group that did not execute leaves no file and
        # therefore publishes nothing.
        if: always() && hashFiles('receipts/test.engine.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: receipt-test.engine-${{ needs.plan.outputs.identity }}
          path: receipts/test.engine.json
          if-no-files-found: error
          # A re-run of this same run would otherwise collide with the attempt
          # before it; the newest attempt is the one that should stand.
          overwrite: true

      - name: Publish the test.foundation receipt as reusable evidence
        # Named by the candidate's input identity, so a later run asks for
        # evidence about *these* inputs rather than fetching every receipt the
        # group ever produced. A group that did not execute leaves no file and
        # therefore publishes nothing.
        if: always() && hashFiles('receipts/test.foundation.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: receipt-test.foundation-${{ needs.plan.outputs.identity }}
          path: receipts/test.foundation.json
          if-no-files-found: error
          # A re-run of this same run would otherwise collide with the attempt
          # before it; the newest attempt is the one that should stand.
          overwrite: true

      - name: Publish the test.runtime receipt as reusable evidence
        # Named by the candidate's input identity, so a later run asks for
        # evidence about *these* inputs rather than fetching every receipt the
        # group ever produced. A group that did not execute leaves no file and
        # therefore publishes nothing.
        if: always() && hashFiles('receipts/test.runtime.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: receipt-test.runtime-${{ needs.plan.outputs.identity }}
          path: receipts/test.runtime.json
          if-no-files-found: error
          # A re-run of this same run would otherwise collide with the attempt
          # before it; the newest attempt is the one that should stand.
          overwrite: true

      - name: Publish the test.glfw receipt as reusable evidence
        # Named by the candidate's input identity, so a later run asks for
        # evidence about *these* inputs rather than fetching every receipt the
        # group ever produced. A group that did not execute leaves no file and
        # therefore publishes nothing.
        if: always() && hashFiles('receipts/test.glfw.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: receipt-test.glfw-${{ needs.plan.outputs.identity }}
          path: receipts/test.glfw.json
          if-no-files-found: error
          # A re-run of this same run would otherwise collide with the attempt
          # before it; the newest attempt is the one that should stand.
          overwrite: true

      - name: Publish the smoke.console receipt as reusable evidence
        # Named by the candidate's input identity, so a later run asks for
        # evidence about *these* inputs rather than fetching every receipt the
        # group ever produced. A group that did not execute leaves no file and
        # therefore publishes nothing.
        if: always() && hashFiles('receipts/smoke.console.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: receipt-smoke.console-${{ needs.plan.outputs.identity }}
          path: receipts/smoke.console.json
          if-no-files-found: error
          # A re-run of this same run would otherwise collide with the attempt
          # before it; the newest attempt is the one that should stand.
          overwrite: true

  haskell-workflow:
    needs: plan
    if: needs.plan.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: ${{ needs.plan.outputs.image }}
      # An init process as PID 1 reaps orphaned descendants, as the hosted
      # runner's own init does. Without it a process group the runner killed
      # on a timeout leaves zombies that still answer a liveness probe.
      options: --init
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Confirm the pinned candidate
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          # The container runs as root over a workspace the runner's user owns,
          # which Git refuses as dubious ownership. The exception is recorded in
          # the job's global configuration, so the runner's later Git reads of
          # this same checkout are answered too.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE" ]; then
            echo "::error::this job checked out $actual rather than the planned candidate $CANDIDATE"
            exit 1
          fi

      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: validation-plan

      - name: Verify the execution environment
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          set -euo pipefail
          python3 tools/validation/ci_image.py verify-worker \
            --plan plan.json --toolchain-file "$RUNNER_TEMP/toolchain.txt" | tee "$RUNNER_TEMP/verify.out"
          declared="$(sed -n 's/^environment=//p' "$RUNNER_TEMP/verify.out")"
          if [ "$declared" != "$ENVIRONMENT" ]; then
            echo "::error::this worker's verified environment $declared is not the planned $ENVIRONMENT"
            exit 1
          fi

      - name: Link a native consumer against the image's GLFW
        run: python3 tools/native/native.py link-check

      - name: Restore the package store
        id: store
        uses: actions/cache/restore@v6
        with:
          path: /opt/hetoimasia/cabal/store
          key: cabal-store-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}
          restore-keys: |
            cabal-store-${{ needs.plan.outputs.environment }}-

      - name: Restore the build tree
        id: tree
        uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-newstyle-workflow-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}-${{ hashFiles('**/*.hs') }}
          restore-keys: |
            dist-newstyle-workflow-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}-
            dist-newstyle-workflow-${{ needs.plan.outputs.environment }}-

      - name: Record the cache results
        env:
          SCOPE: ${{ github.ref }}
          STORE_HIT: ${{ steps.store.outputs.cache-hit }}
          STORE_KEY: ${{ steps.store.outputs.cache-primary-key }}
          STORE_MATCHED: ${{ steps.store.outputs.cache-matched-key }}
          TREE_HIT: ${{ steps.tree.outputs.cache-hit }}
          TREE_KEY: ${{ steps.tree.outputs.cache-primary-key }}
          TREE_MATCHED: ${{ steps.tree.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          result() { if [ "$1" = "true" ]; then echo hit; elif [ -n "$2" ]; then echo partial; else echo miss; fi; }
          {
            echo "## haskell-workflow caches"
            echo
            echo "Scope \`$SCOPE\`."
            echo
            echo "| Cache | Result | Key | Restored from |"
            echo "| --- | --- | --- | --- |"
            echo "| package store | $(result "$STORE_HIT" "$STORE_MATCHED") | \`$STORE_KEY\` | \`${STORE_MATCHED:-none}\` |"
            echo "| build tree | $(result "$TREE_HIT" "$TREE_MATCHED") | \`$TREE_KEY\` | \`${TREE_MATCHED:-none}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the groups this candidate still needs
        env:
          SELECTED: ${{ needs.plan.outputs.selected }}
          EXECUTE: ${{ needs.plan.outputs.execute }}
          ASSIGNED: ${{ needs.plan.outputs.workflow-groups }}
        run: |
          set -uo pipefail
          mkdir -p receipts
          toolchain=()
          while IFS= read -r entry; do
            toolchain+=(--toolchain "$entry")
          done < "$RUNNER_TEMP/toolchain.txt"
          status=0
          for group in $ASSIGNED; do
            case " $EXECUTE " in
              *" $group "*) ;;
              *)
                case " $SELECTED " in
                  *" $group "*) echo "skipping $group: an earlier execution already covers it" ;;
                  *) echo "skipping $group: the plan did not select it" ;;
                esac
                continue
                ;;
            esac
            python3 -I tools/validation/run.py "$group" \
              --plan plan.json \
              --receipts receipts \
              --worker haskell-workflow \
              --runner-class cpu \
              "${toolchain[@]}" || status=1
          done
          exit "$status"

      - name: Save the package store
        if: ${{ !cancelled() && steps.store.outcome == 'success' && steps.store.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /opt/hetoimasia/cabal/store
          key: ${{ steps.store.outputs.cache-primary-key }}

      - name: Save the build tree
        if: ${{ !cancelled() && steps.tree.outcome == 'success' && steps.tree.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: dist-newstyle
          key: ${{ steps.tree.outputs.cache-primary-key }}

      - name: Upload the receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-receipts-haskell-workflow
          path: receipts/
          if-no-files-found: warn

      - name: Publish the test.workflow receipt as reusable evidence
        # Named by the candidate's input identity, so a later run asks for
        # evidence about *these* inputs rather than fetching every receipt the
        # group ever produced. A group that did not execute leaves no file and
        # therefore publishes nothing.
        if: always() && hashFiles('receipts/test.workflow.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: receipt-test.workflow-${{ needs.plan.outputs.identity }}
          path: receipts/test.workflow.json
          if-no-files-found: error
          # A re-run of this same run would otherwise collide with the attempt
          # before it; the newest attempt is the one that should stand.
          overwrite: true

  glfw-native:
    needs: plan
    # The only worker declaring the display runner class. Its display exists
    # only inside its own group executions, so no CPU worker's path starts,
    # waits for, or depends on one.
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: ${{ needs.plan.outputs.image }}
      # An init process as PID 1 reaps orphaned descendants, as the hosted
      # runner's own init does. Without it a process group the runner killed
      # on a timeout leaves zombies that still answer a liveness probe.
      options: --init
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Confirm the pinned candidate
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          # The container runs as root over a workspace the runner's user owns,
          # which Git refuses as dubious ownership. The exception is recorded in
          # the job's global configuration, so the runner's later Git reads of
          # this same checkout are answered too.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE" ]; then
            echo "::error::this job checked out $actual rather than the planned candidate $CANDIDATE"
            exit 1
          fi

      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: validation-plan

      - name: Verify the execution environment
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          set -euo pipefail
          python3 tools/validation/ci_image.py verify-worker \
            --plan plan.json --toolchain-file "$RUNNER_TEMP/toolchain.txt" | tee "$RUNNER_TEMP/verify.out"
          declared="$(sed -n 's/^environment=//p' "$RUNNER_TEMP/verify.out")"
          if [ "$declared" != "$ENVIRONMENT" ]; then
            echo "::error::this worker's verified environment $declared is not the planned $ENVIRONMENT"
            exit 1
          fi

      - name: Link a native consumer against the image's GLFW
        run: python3 tools/native/native.py link-check

      - name: Restore the package store
        id: store
        uses: actions/cache/restore@v6
        with:
          path: /opt/hetoimasia/cabal/store
          key: cabal-store-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}
          restore-keys: |
            cabal-store-${{ needs.plan.outputs.environment }}-

      - name: Restore the build tree
        id: tree
        uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-newstyle-native-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}-${{ hashFiles('**/*.hs') }}
          restore-keys: |
            dist-newstyle-native-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}-
            dist-newstyle-native-${{ needs.plan.outputs.environment }}-

      - name: Record the cache results
        env:
          SCOPE: ${{ github.ref }}
          STORE_HIT: ${{ steps.store.outputs.cache-hit }}
          STORE_KEY: ${{ steps.store.outputs.cache-primary-key }}
          STORE_MATCHED: ${{ steps.store.outputs.cache-matched-key }}
          TREE_HIT: ${{ steps.tree.outputs.cache-hit }}
          TREE_KEY: ${{ steps.tree.outputs.cache-primary-key }}
          TREE_MATCHED: ${{ steps.tree.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          result() { if [ "$1" = "true" ]; then echo hit; elif [ -n "$2" ]; then echo partial; else echo miss; fi; }
          {
            echo "## glfw-native caches"
            echo
            echo "Scope \`$SCOPE\`."
            echo
            echo "| Cache | Result | Key | Restored from |"
            echo "| --- | --- | --- | --- |"
            echo "| package store | $(result "$STORE_HIT" "$STORE_MATCHED") | \`$STORE_KEY\` | \`${STORE_MATCHED:-none}\` |"
            echo "| build tree | $(result "$TREE_HIT" "$TREE_MATCHED") | \`$TREE_KEY\` | \`${TREE_MATCHED:-none}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the groups this candidate still needs
        env:
          SELECTED: ${{ needs.plan.outputs.selected }}
          EXECUTE: ${{ needs.plan.outputs.execute }}
          ASSIGNED: ${{ needs.plan.outputs.native-groups }}
        run: |
          set -uo pipefail
          mkdir -p receipts
          toolchain=()
          while IFS= read -r entry; do
            toolchain+=(--toolchain "$entry")
          done < "$RUNNER_TEMP/toolchain.txt"
          status=0
          # Each group runs inside an isolated X11 display started for it alone
          # and stopped after it. A display that cannot be established ends the
          # group before it starts, writes no receipt, and fails this job, which
          # the aggregate then reports: it is never skipped, retried, or excused.
          for group in $ASSIGNED; do
            case " $EXECUTE " in
              *" $group "*) ;;
              *)
                case " $SELECTED " in
                  *" $group "*) echo "skipping $group: an earlier execution already covers it" ;;
                  *) echo "skipping $group: the plan did not select it" ;;
                esac
                continue
                ;;
            esac
            bash tools/display/x11.sh --summary "$GITHUB_STEP_SUMMARY" -- \
              python3 -I tools/validation/run.py "$group" \
              --plan plan.json \
              --receipts receipts \
              --worker glfw-native \
              --runner-class display \
              "${toolchain[@]}" || status=1
          done
          exit "$status"

      - name: Save the package store
        if: ${{ !cancelled() && steps.store.outcome == 'success' && steps.store.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /opt/hetoimasia/cabal/store
          key: ${{ steps.store.outputs.cache-primary-key }}

      - name: Save the build tree
        if: ${{ !cancelled() && steps.tree.outcome == 'success' && steps.tree.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: dist-newstyle
          key: ${{ steps.tree.outputs.cache-primary-key }}

      - name: Upload the receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-receipts-glfw-native
          path: receipts/
          if-no-files-found: warn

      - name: Publish the test.glfw-native receipt as reusable evidence
        # Named by the candidate's input identity, so a later run asks for
        # evidence about *these* inputs rather than fetching every receipt the
        # group ever produced. A group that did not execute leaves no file and
        # therefore publishes nothing.
        if: always() && hashFiles('receipts/test.glfw-native.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: receipt-test.glfw-native-${{ needs.plan.outputs.identity }}
          path: receipts/test.glfw-native.json
          if-no-files-found: error
          # A re-run of this same run would otherwise collide with the attempt
          # before it; the newest attempt is the one that should stand.
          overwrite: true

  seed-dependencies:
    needs: plan
    # Only a default-branch push whose engine worker did not run and whose
    # environment has no dependency cache yet. It builds dependencies and
    # executes no validation group, so it writes no receipt.
    if: needs.plan.outputs.seed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: ${{ needs.plan.outputs.image }}
      # An init process as PID 1 reaps orphaned descendants, as the hosted
      # runner's own init does. Without it a process group the runner killed
      # on a timeout leaves zombies that still answer a liveness probe.
      options: --init
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Confirm the pinned candidate
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          # The container runs as root over a workspace the runner's user owns,
          # which Git refuses as dubious ownership. The exception is recorded in
          # the job's global configuration, so the runner's later Git reads of
          # this same checkout are answered too.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE" ]; then
            echo "::error::this job checked out $actual rather than the planned candidate $CANDIDATE"
            exit 1
          fi

      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: validation-plan

      - name: Verify the execution environment
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          set -euo pipefail
          python3 tools/validation/ci_image.py verify-worker \
            --plan plan.json --toolchain-file "$RUNNER_TEMP/toolchain.txt" | tee "$RUNNER_TEMP/verify.out"
          declared="$(sed -n 's/^environment=//p' "$RUNNER_TEMP/verify.out")"
          if [ "$declared" != "$ENVIRONMENT" ]; then
            echo "::error::this worker's verified environment $declared is not the planned $ENVIRONMENT"
            exit 1
          fi

      - name: Restore the package store
        id: store
        uses: actions/cache/restore@v6
        with:
          path: /opt/hetoimasia/cabal/store
          key: cabal-store-${{ needs.plan.outputs.environment }}-${{ hashFiles('cabal.project', 'cabal.project.common', '**/*.cabal') }}
          restore-keys: |
            cabal-store-${{ needs.plan.outputs.environment }}-

      - name: Build the dependencies and nothing else
        if: steps.store.outputs.cache-hit != 'true'
        run: cabal build all --enable-tests --only-dependencies

      - name: Save the package store
        if: steps.store.outcome == 'success' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /opt/hetoimasia/cabal/store
          key: ${{ steps.store.outputs.cache-primary-key }}

  build-test:
    needs: [plan, haskell-engine, haskell-workflow, glfw-native]
    # This is the required check, so it must reach a conclusion whatever
    # happened upstream. A skipped required workflow is not a verdict, and a
    # documentation candidate reaches its status through exactly this path.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reading the pull request's current head, base, and body is what proves
      # this run's plan still describes it; reading the run's own jobs is what
      # produces the timings. Neither needs write access.
      pull-requests: read
      actions: read
    steps:
      - name: Require a resolved plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::the plan job ${{ needs.plan.result }}, so there is no plan to decide a verdict against"
          exit 1

      - name: Check out the candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: validation-plan

      - name: Download the receipts
        uses: actions/download-artifact@v8
        with:
          pattern: validation-receipts-*
          path: receipts
          merge-multiple: true
        # A worker that never uploaded receipts is an obstacle the aggregate
        # reports by name; failing the download here would hide it behind a
        # generic artifact error.
        continue-on-error: true

      - name: Read the pull request's current state
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq '.head.sha' > current-head.txt
          gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq '.base.sha' > current-base.txt
          # The body goes straight to a file: it is contributor-authored text,
          # and only the planner's grammar may interpret it.
          gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq '.body // ""' > current-body.txt
          git fetch --no-tags --quiet origin "$(cat current-base.txt)" "$(cat current-head.txt)" 2>/dev/null || true
          git merge-base "$(cat current-base.txt)" "$(cat current-head.txt)" > current-merge-base.txt

      - name: Record the run timings
        # Timings are a report, never a result: `tools/validation/timings.py`
        # says as much itself, and nothing downstream reads what this step
        # produces. So an API error, or a job listing the report cannot read,
        # is a reporting gap — and failing here would suppress a verdict the
        # plan, the receipts, and the freshness inputs were all present to
        # decide, because the step that decides it carries the default success
        # condition. This step therefore names the gap in the log and in the
        # job summary and concludes successfully.
        #
        # It weakens no gate above it. The plan requirement and the read of the
        # pull request's current state remain required steps whose failure
        # skips the verdict exactly as before, and the verdict step keeps its
        # own default condition so that stays true.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          unavailable() {
            echo "::warning::run timings are unavailable: $1"
            {
              echo "## Run timings"
              echo
              echo "Unavailable: $1."
              echo
              echo "Timings are ancillary: they never decide a verdict, so this"
              echo "gap does not affect the one \`build-test\` reports."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          listed=$?
          if [ "$listed" -ne 0 ]; then
            unavailable "the API call listing this run's jobs exited $listed"
          fi
          python3 tools/validation/timings.py --jobs jobs.json --summary "$GITHUB_STEP_SUMMARY"
          rendered=$?
          if [ "$rendered" -ne 0 ]; then
            unavailable "tools/validation/timings.py exited $rendered reading the job listing"
          fi

      - name: Decide the verdict
        run: |
          set -uo pipefail
          arguments=(--plan plan.json --receipts receipts --summary "$GITHUB_STEP_SUMMARY")
          arguments+=(--applicability applicability.json)
          # Each worker's job result. The groups each one owns come from the
          # plan, and a worker that owes selected work but reports no result, or
          # did not succeed, fails the verdict whatever the others did.
          arguments+=(--worker "haskell-engine=${{ needs['haskell-engine'].result }}")
          arguments+=(--worker "haskell-workflow=${{ needs['haskell-workflow'].result }}")
          arguments+=(--worker "glfw-native=${{ needs['glfw-native'].result }}")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            arguments+=(--expect-head "$(cat current-head.txt)")
            arguments+=(--expect-base "$(cat current-merge-base.txt)")
            arguments+=(--expect-request-file current-body.txt)
          fi
          python3 tools/validation/aggregate.py "${arguments[@]}"
